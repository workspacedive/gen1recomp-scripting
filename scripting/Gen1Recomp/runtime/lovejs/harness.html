<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gen1Recomp love.js Gate</title>
<style>
  html,body{margin:0;background:#111;color:#fff;width:100%;height:100%;overflow:hidden}
  canvas{width:100%;height:100%;display:none;outline:none}
  #spinner{position:fixed;inset:0;display:grid;place-items:center;font:16px system-ui}
  #spinner.pending::after{content:"Preparing love.js…"}
  #spinner.loading::after{content:"Booting LÖVE 11.5…"}
  #spinner.error::after{content:"love.js failed"}
</style>
<canvas id="canvas" tabindex="0"></canvas>
<div id="spinner" class="pending"></div>
<script>
(function () {
  var terminal = false;
  var bridge = {
    send: function (type, detail, data) {
      return window.webkit.messageHandlers.gen1HostBridge.postMessage({
        protocolVersion: 1,
        type: type,
        detail: String(detail || ''),
        data: data || {}
      });
    },
    terminal: function (type, detail, data) {
      if (terminal) return;
      terminal = true;
      bridge.send(type, detail, data);
    }
  };
  window.__gen1Bridge = bridge;

  var canvas = document.getElementById('canvas');
  var spinner = document.getElementById('spinner');
  new MutationObserver(function () {
    if (spinner.className === '') bridge.terminal('runtime.ready', 'Module.postrun reached', {
      canvasWidth: canvas.width,
      canvasHeight: canvas.height,
      indexedDB: typeof indexedDB !== 'undefined',
      webAssembly: typeof WebAssembly !== 'undefined'
    });
    if (spinner.className === 'error') bridge.terminal('runtime.error', 'player error state');
  }).observe(spinner, { attributes: true, attributeFilter: ['class'] });

  bridge.send('bridge.ready', 'Host bridge reachable', {
    indexedDB: typeof indexedDB !== 'undefined',
    webAssembly: typeof WebAssembly !== 'undefined'
  });

  var resources = [
    'nogame.love', 'lua/normalize1.lua', 'lua/normalize2.lua', '11.5/love.js'
  ];
  Promise.all(resources.map(function (path) {
    return fetch(path, { cache: 'no-store' }).then(function (response) {
      return response.arrayBuffer().then(function (bytes) {
        if (bytes.byteLength === 0) throw new Error(path + ': empty response');
        return { path: path, bytes: bytes.byteLength, status: response.status };
      });
    });
  })).then(function (results) {
    bridge.send('resources.ready', 'Adapter resources are readable; WASM remains runtime-owned', { resources: results });
    var script = document.createElement('script');
    script.src = 'player.js?g=nogame.love&v=11.5&n=1';
    script.onload = function () { bridge.send('player.loaded', 'player.js returned from initial execution'); };
    script.onerror = function () { bridge.terminal('runtime.error', 'player.js failed to load'); };
    document.body.appendChild(script);
  }).catch(function (error) {
    bridge.terminal('resources.error', String(error));
  });

  setTimeout(function () {
    bridge.terminal('runtime.timeout', 'No Module.postrun milestone within 30 seconds');
  }, 30000);
}());
</script>
